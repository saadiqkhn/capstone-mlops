apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: breast-cancer-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/saadiqkhn/capstone-mlops.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: mlops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
