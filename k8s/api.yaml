apiVersion: apps/v1
kind: Deployment
metadata:
  name: breast-cancer-api
  namespace: mlops
  labels:
    app: breast-cancer-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: breast-cancer-api
  template:
    metadata:
      labels:
        app: breast-cancer-api
    spec:
      containers:
        - name: api
          image: breast-cancer-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: breast-cancer-api
  namespace: mlops
spec:
  selector:
    app: breast-cancer-api
  ports:
    - port: 8000
      targetPort: 8000
